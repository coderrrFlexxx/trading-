<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="bull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#00B8D9"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- FULL BLEED BACKGROUND
       No rounded corners here.
       Android launcher will apply its own mask. -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.12"
     stroke="#64748b"
     stroke-width="1.5"
     stroke-dasharray="5 5">

    <line x1="60" y1="140" x2="452" y2="140"/>
    <line x1="60" y1="210" x2="452" y2="210"/>
    <line x1="60" y1="280" x2="452" y2="280"/>
    <line x1="60" y1="350" x2="452" y2="350"/>

    <line x1="140" y1="80" x2="140" y2="420"/>
    <line x1="256" y1="80" x2="256" y2="420"/>
    <line x1="372" y1="80" x2="372" y2="420"/>
  </g>

  <!-- Candles -->
  <g opacity="0.85">

    <line x1="100" y1="260" x2="100" y2="380"
          stroke="#00FFA3" stroke-width="3"/>
    <rect x="91" y="285" width="18" height="65"
          rx="3" fill="#00FFA3"/>

    <line x1="150" y1="280" x2="150" y2="390"
          stroke="#FF4D6D" stroke-width="3"/>
    <rect x="141" y="300" width="18" height="55"
          rx="3" fill="#FF4D6D"/>

    <line x1="200" y1="210" x2="200" y2="350"
          stroke="#00FFA3" stroke-width="3"/>
    <rect x="191" y="235" width="18" height="80"
          rx="3" fill="#00FFA3"/>

    <line x1="250" y1="180" x2="250" y2="310"
          stroke="#00FFA3" stroke-width="3"/>
    <rect x="241" y="200" width="18" height="70"
          rx="3" fill="#00FFA3"/>

    <line x1="300" y1="190" x2="300" y2="280"
          stroke="#FF4D6D" stroke-width="3"/>
    <rect x="291" y="210" width="18" height="40"
          rx="3" fill="#FF4D6D"/>

    <line x1="350" y1="120" x2="350" y2="250"
          stroke="#00FFA3" stroke-width="3"/>
    <rect x="341" y="140" width="18" height="85"
          rx="3" fill="#00FFA3"/>

    <line x1="400" y1="80" x2="400" y2="200"
          stroke="#00FFA3" stroke-width="3"/>
    <rect x="391" y="95" width="18" height="60"
          rx="3" fill="#00FFA3"/>
  </g>

  <!-- Chart glow -->
  <path
    d="M60 385
       C130 375 175 285 235 255
       C295 225 335 155 425 95"
    fill="none"
    stroke="#00FFA3"
    stroke-width="14"
    opacity="0.25"
    filter="url(#glow)"
  />

  <!-- Chart -->
  <path
    d="M60 385
       C130 375 175 285 235 255
       C295 225 335 155 425 95"
    fill="none"
    stroke="#00FFA3"
    stroke-width="7"
    stroke-linecap="round"
  />

  <path
    d="M60 385
       C130 375 175 285 235 255
       C295 225 335 155 425 95"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linecap="round"
  />

  <circle cx="425" cy="95" r="10" fill="#00FFA3"/>
  <circle cx="425" cy="95" r="5" fill="#FFFFFF"/>

  <!-- Bull -->
  <g transform="translate(186 260) scale(.68)" opacity=".95">

    <path
      d="M-20-30
         C-60-100-110-80-100-40
         C-85-55-55-40-35 5Z"
      fill="url(#bull)"
    />

    <path
      d="M220-30
         C260-100 310-80 300-40
         C285-55 255-40 235 5Z"
      fill="url(#bull)"
    />

    <polygon
      points="100,0 20,-30 35,45 100,85 165,45 180,-30"
      fill="#00FFA3"
    />

    <polygon
      points="100,85 35,45 50,130 100,170 150,130 165,45"
      fill="#00D294"
    />

    <polygon
      points="100,170 50,130 75,190 100,205 125,190 150,130"
      fill="#00A878"
    />

    <polygon
      points="65,45 85,40 75,55"
      fill="#FFFFFF"
    />

    <polygon
      points="135,45 115,40 125,55"
      fill="#FFFFFF"
    />

  </g>

  <!-- Bottom badge -->
  <rect
    x="55"
    y="435"
    width="115"
    height="34"
    rx="17"
    fill="#13233c"
    stroke="#1e3a5f"
    stroke-width="1.5"
  />

  <circle cx="72" cy="452" r="6" fill="#00FFA3"/>

  <text
    x="88"
    y="457"
    fill="#00FFA3"
    font-family="system-ui, sans-serif"
    font-size="13"
    font-weight="700"
    letter-spacing="1">
    BULL +24%
  </text>

</svg>
